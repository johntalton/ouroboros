<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
		<meta name="view-transition" content="same-origin" />
		<meta content="light dark" name="color-scheme">

		<title>Ouroboros</title>
		<meta name="description" content="Hosting Web Server in the Browser">

		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<!-- <link rel="manifest" href="manifest.json" /> -->
		<script type="importmap">
			{
				"imports": {
          "@johntalton/bitsmush": "/node_modules/@johntalton/bitsmush/lib/bitsmush.js",
          "@johntalton/and-other-delights": "/node_modules/@johntalton/and-other-delights/lib/index.js",
					"@johntalton/ftdi": "/node_modules/@johntalton/ftdi/lib/index.js",
          "@johntalton/ftdi/spi": "/node_modules/@johntalton/ftdi/lib/spi/index.js",
          "@johntalton/wiz5500": "/node_modules/@johntalton/wiz5500/src/index.js",
					"@johntalton/http-util/headers": "/node_modules/@johntalton/http-util/src/headers/index.js",
					"@johntalton/http-util/util": "/node_modules/@johntalton/http-util/src/headers/util/index.js"
    		}
			}
		</script>
		<script src="./index.js" type="module" async defer crossorigin="anonymous"></script>
		<link rel="stylesheet" type="text/css" href="./index.css" />
	</head>
	<body >
    <header>
      <h1>Ouroboros</h1>
			<nav>
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/configuration">Configuration</a></li>
				</ul>
			</nav>
    </header>
    <main>

      <button name="PairUSB" type="button">Pair USB</button>
			<button name="TestInfo" type="button">Info</button>
			<button name="TestReceive" type="button">Receive</button>
			<button name="TestSend" type="button">Send</button>
			<button name="TestClose" type="button">Close</button>
			<button name="TestReset" type="button">Reset</button>

			<section>
				<form id="ConfigurationForm">
					<fieldset>
						<legend>TCP/IP</legend>

						<label>
							<span>MAC</span>
							<input name="MAC" value="0:0:0:0:0:0" />
						</label>

						<label>
							<span>IP Address</span>
							<input name="IP" value="10.0.0.20"/>
						</label>

						<label>
							<span>Subnet Mask</span>
							<input name="Subnet" value="255.0.0.0"/>
						</label>

						<label>
							<span>Gateway</span>
							<input name="Gateway" value="0.0.0.0"/>
						</label>
					</fieldset>

					<button type="submit">Save</button>
				</form>
			</section>
    </main>
    <footer>
    </footer>
  </body>
</html>
